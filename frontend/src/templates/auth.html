<sc-if value="{{isAuthChecking}}" hint-placeholder-val="{{true}}">
<div class="ui-001" data-screen-label="Checking session">
  <div class="ui-002">
    <div class="ui-003">
      <svg width="34" height="34" viewBox="0 0 28 28"><circle cx="11" cy="14" r="8.5" fill="var(--accent)" opacity="0.9"></circle><circle cx="17.5" cy="14" r="8.5" fill="var(--accent)" opacity="0.4"></circle></svg>
      <span class="ui-004">loop</span>
    </div>
    <p class="ui-005">Checking your session…</p>
  </div>
</div>
</sc-if>

<sc-if value="{{isAuthStartupError}}" hint-placeholder-val="{{false}}">
<div class="ui-001" data-screen-label="Session error">
  <div class="ui-002">
    <div class="ui-003">
      <svg width="34" height="34" viewBox="0 0 28 28"><circle cx="11" cy="14" r="8.5" fill="var(--accent)" opacity="0.9"></circle><circle cx="17.5" cy="14" r="8.5" fill="var(--accent)" opacity="0.4"></circle></svg>
      <span class="ui-004">loop</span>
    </div>
    <h1 class="ui-006">Could not load the app</h1>
    <p class="ui-007" role="alert">{{bootstrapError}}</p>
    <button class="ui-008" onclick="{{retryAuthBootstrap}}">Retry</button>
  </div>
</div>
</sc-if>

<sc-if value="{{isAuth}}" hint-placeholder-val="{{false}}">
<div class="ui-001" data-screen-label="Auth">
  <div class="ui-009">
    <div class="ui-010">
      <svg width="34" height="34" viewBox="0 0 28 28"><circle cx="11" cy="14" r="8.5" fill="var(--accent)" opacity="0.9"></circle><circle cx="17.5" cy="14" r="8.5" fill="var(--accent)" opacity="0.4"></circle></svg>
      <span class="ui-004">loop</span>
    </div>
    <p class="ui-011">Your people, without the noise.</p>
    <div class="ui-012">
      <sc-for list="{{authTabs}}" as="t" hint-placeholder-count="2">
        <button class="ui-013" type="button" onclick="{{t.pick}}" style="background:{{t.bg}};color:{{t.color}};box-shadow:{{t.sh}}">{{t.label}}</button>
      </sc-for>
    </div>
    <form onsubmit="{{submitAuth}}">
    <sc-if value="{{authIsLogin}}" hint-placeholder-val="{{false}}">
      <div class="ui-014">
        <input class="ui-015" type="email" autocomplete="email" required placeholder="Email" value="{{authEmail}}" onchange="{{onAuthEmail}}">
        <input class="ui-015" type="password" autocomplete="current-password" required placeholder="Password" value="{{authPassword}}" onchange="{{onAuthPassword}}">
      </div>
    </sc-if>
    <sc-if value="{{authIsReg}}" hint-placeholder-val="{{false}}">
      <div class="ui-014">
        <div class="ui-016">
          <input class="ui-017" id="registration-avatar" type="file" accept="image/jpeg,image/png,image/gif,image/webp" onchange="{{onRegistrationAvatar}}">
          <button class="ui-018" type="button" onclick="{{pickRegistrationAvatar}}" title="Optional JPEG, PNG, GIF or WebP avatar (max 20 MB)">
            <sc-if value="{{registrationAvatarHasPreview}}" hint-placeholder-val="{{false}}">
              <img class="ui-019" src="{{registrationAvatarPreviewURL}}" alt="Selected avatar preview">
            </sc-if>
            <sc-if value="{{registrationAvatarMissingPreview}}" hint-placeholder-val="{{true}}">
              <span class="ui-020">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Zm8 9a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path></svg>
                <span class="ui-021">{{avatarButtonLabel}}</span>
              </span>
            </sc-if>
          </button>
        </div>
        <div class="responsive-grid ui-022">
          <input class="ui-023" autocomplete="given-name" required placeholder="First name" value="{{regFirstName}}" onchange="{{onRegFirstName}}">
          <input class="ui-023" autocomplete="family-name" required placeholder="Last name" value="{{regLastName}}" onchange="{{onRegLastName}}">
        </div>
        <input class="ui-015" type="email" autocomplete="email" required placeholder="Email" value="{{authEmail}}" onchange="{{onAuthEmail}}">
        <input class="ui-015" type="password" autocomplete="new-password" required placeholder="Password" value="{{authPassword}}" onchange="{{onAuthPassword}}">
        <label class="ui-024">Date of birth</label>
        <input class="ui-025" type="text" inputmode="numeric" autocomplete="bday" required maxlength="10" pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}" placeholder="DD-MM-YYYY" title="Use DD-MM-YYYY format" aria-describedby="date-of-birth-help" value="{{regDateOfBirth}}" onchange="{{onRegDateOfBirth}}">
        <div id="date-of-birth-help" class="date-input-help">DD-MM-YYYY, for example 02-02-1986</div>
        <select class="ui-015" value="{{regGender}}" onchange="{{onRegGender}}">
          <option value="">Gender (optional)</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <input class="ui-015" placeholder="Nickname (optional)" value="{{regNickname}}" onchange="{{onRegNickname}}">
        <textarea class="ui-015" placeholder="About me (optional)" rows="2" value="{{regAboutMe}}" onchange="{{onRegAboutMe}}"></textarea>
      </div>
    </sc-if>
    <sc-if value="{{authHasError}}" hint-placeholder-val="{{false}}">
      <div class="ui-026" role="alert">{{authError}}</div>
    </sc-if>
    <button class="ui-027" type="submit" disabled="{{authDisabled}}" style="cursor:{{authButtonCursor}};opacity:{{authButtonOpacity}}" style-hover="transform:translateY(-1px);filter:brightness(1.05)" style-active="transform:scale(.98)">{{authCta}}</button>
    </form>
  </div>
</div>
</sc-if>
