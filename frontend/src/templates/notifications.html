<sc-if value="{{isNotifs}}" hint-placeholder-val="{{false}}">
    <div class="ui-082" data-screen-label="Notifications">
      <div class="page-header-row">
        <h1 class="ui-083">Notifications</h1>
        <button class="ui-275" onclick="{{markAllRead}}" disabled="{{markAllReadDisabled}}" style-hover="background:var(--surface2)">Mark all as read</button>
      </div>
      <sc-if value="{{notificationsHasError}}" hint-placeholder-val="{{false}}"><div class="ui-276" role="alert">{{notificationsError}} <button class="ui-277" onclick="{{retryNotifications}}">Retry</button></div></sc-if>
      <sc-if value="{{notificationsLoading}}" hint-placeholder-val="{{false}}"><div class="ui-278">Loading notifications…</div></sc-if>
      <sc-if value="{{notificationsEmpty}}" hint-placeholder-val="{{false}}"><div class="ui-279">No notifications yet.</div></sc-if>
      <div class="ui-280">
        <sc-for list="{{notifItems}}" as="nt" hint-placeholder-count="4">
          <div class="ui-281" style="background:{{nt.bg}};animation-delay:{{nt.delay}}">
            <div class="ui-036">
              <div class="ui-242" onclick="{{nt.goProfile}}" style="background:{{nt.user.color}}">
                <sc-if value="{{nt.user.hasAvatar}}" hint-placeholder-val="{{false}}"><img class="ui-038" src="{{nt.user.avatarUrl}}" onerror="this.onerror=null;this.src='/static/avatars/neutral.svg'" alt=""></sc-if>
                <sc-if value="{{nt.user.noAvatar}}" hint-placeholder-val="{{true}}">{{nt.user.initials}}</sc-if>
              </div>
              <span class="ui-282">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{nt.icon}}"></path></svg>
              </span>
            </div>
            <div class="ui-040">
              <p class="ui-283" onclick="{{nt.open}}"><b class="ui-284" onclick="{{nt.goProfile}}">{{nt.user.name}}</b> {{nt.text}}</p>
              <div class="ui-285">{{nt.time}}</div>
              <sc-if value="{{nt.pending}}" hint-placeholder-val="{{false}}">
                <div class="ui-286">
                  <button class="ui-287" onclick="{{nt.accept}}" disabled="{{nt.disabled}}" style-active="transform:scale(.96)">Accept</button>
                  <button class="ui-288" onclick="{{nt.decline}}" disabled="{{nt.disabled}}" style-active="transform:scale(.96)">Decline</button>
                </div>
              </sc-if>
              <sc-if value="{{nt.done}}" hint-placeholder-val="{{false}}">
                <div class="ui-289">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6.5 9.5 17 4 11.5"></path></svg>
                  {{nt.doneLabel}}
                </div>
              </sc-if>
              <sc-if value="{{nt.hasError}}" hint-placeholder-val="{{false}}"><div class="ui-290" role="alert">{{nt.error}}</div></sc-if>
            </div>
            <sc-if value="{{nt.unreadDot}}" hint-placeholder-val="{{false}}"><span class="ui-291"></span></sc-if>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{notificationsHasMore}}" hint-placeholder-val="{{false}}"><button class="ui-292" onclick="{{loadMoreNotifications}}" disabled="{{notificationsLoadMoreDisabled}}">Load more</button></sc-if>
    </div>
    </sc-if>
